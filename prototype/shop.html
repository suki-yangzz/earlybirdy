<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>成长商城 · 芽芽成长</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F3E9DC; color: #3B2B22; }
  .card-shadow { box-shadow: 0 8px 20px -8px rgba(120, 80, 40, 0.25); }
  .cat-btn.active { background: #FF6B4A; color: #fff; }
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#FFF8EE] flex flex-col overflow-hidden relative">
<!-- 顶部 -->
<header class="shrink-0 px-5 pt-4 pb-2 bg-[#FFF8EE]">
<div class="flex items-center justify-between">
<h1 class="text-[20px] font-bold">成长商城</h1>
<div class="flex items-center gap-1.5 bg-white rounded-full px-3 h-9 card-shadow">
<iconify-icon class="text-[16px] text-[#F5A623]" icon="ph:star-four-fill"></iconify-icon>
<span class="text-[13px] font-bold text-[#3B2B22]" id="coinTop">860</span>
<span class="text-[10px] text-[#A08876]">成长值</span>
</div>
</div>
<p class="text-[11px] text-[#A08876] mt-1.5">完成每日任务就能攒，孩子自己也能换到小礼物</p>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden px-5 pb-6 [scrollbar-width:none] [&amp;::-webkit-scrollbar]:hidden">
<!-- 兑换横幅 -->
<section class="mt-2 rounded-[24px] overflow-hidden relative card-shadow">
<div class="absolute inset-0 bg-gradient-to-r from-[#3FC1A0] to-[#7FD9B8]"></div>
<div class="relative px-4 py-4 flex items-center justify-between">
<div class="text-white">
<p class="text-[10px] font-bold bg-white/25 inline-block rounded-full px-2 py-0.5">本周限定</p>
<p class="text-[17px] font-bold mt-1.5">连续打卡 7 天</p>
<p class="text-[11px] text-white/90 mt-0.5">免费换「小熊贴纸包」一份</p>
</div>
<a class="shrink-0 h-9 px-3.5 rounded-full bg-white text-[#2E9E82] text-[12px] font-bold flex items-center" href="tasks.html">去打卡</a>
</div>
</section>
<!-- 分类 -->
<div class="mt-3 flex gap-2 overflow-x-auto pb-1 [scrollbar-width:none] [&amp;::-webkit-scrollbar]:hidden" id="catRow">
<button class="cat-btn active shrink-0 h-9 px-3.5 rounded-full bg-white text-[12px] font-bold text-[#6B5647] card-shadow" data-cat="all">全部</button>
<button class="cat-btn shrink-0 h-9 px-3.5 rounded-full bg-white text-[12px] font-bold text-[#6B5647] card-shadow" data-cat="card">认知卡</button>
<button class="cat-btn shrink-0 h-9 px-3.5 rounded-full bg-white text-[12px] font-bold text-[#6B5647] card-shadow" data-cat="toy">成长玩具</button>
<button class="cat-btn shrink-0 h-9 px-3.5 rounded-full bg-white text-[12px] font-bold text-[#6B5647] card-shadow" data-cat="book">绘本故事</button>
<button class="cat-btn shrink-0 h-9 px-3.5 rounded-full bg-white text-[12px] font-bold text-[#6B5647] card-shadow" data-cat="course">亲子课程</button>
<button class="cat-btn shrink-0 h-9 px-3.5 rounded-full bg-white text-[12px] font-bold text-[#6B5647] card-shadow" data-cat="parent">家长专区</button>
</div>
<!-- 商品 -->
<div class="mt-3 grid grid-cols-2 gap-2.5" id="goodsGrid"></div>
<div class="mt-4 bg-[#FFF1E8] rounded-[20px] p-3 flex items-start gap-2">
<iconify-icon class="text-[16px] text-[#FF6B4A] shrink-0 mt-0.5" icon="ph:info-fill"></iconify-icon>
<p class="text-[10.5px] leading-relaxed text-[#8A5E48]">成长值有效期为 12 个月，兑换成功后 5 个工作日发货；实物每单限兑 1 件，陪娃一起拆礼物更有仪式感。</p>
</div>
<div class="h-2"></div>
</main>
<!-- 底部导航 -->
<nav class="shrink-0 bg-white border-t border-[#F2E5D7] px-3 pt-1.5 pb-3">
<div class="flex items-center justify-around">
<a class="flex flex-col items-center gap-0.5 w-16" href="home.html">
<iconify-icon class="text-[23px] text-[#B6A18E]" icon="ph:house-duotone"></iconify-icon>
<span class="text-[10px] font-semibold text-[#B6A18E]">首页</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16" href="tasks.html">
<iconify-icon class="text-[23px] text-[#B6A18E]" icon="ph:check-circle-duotone"></iconify-icon>
<span class="text-[10px] font-semibold text-[#B6A18E]">任务</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16" href="shop.html">
<iconify-icon class="text-[23px] text-[#FF6B4A]" icon="ph:storefront-fill"></iconify-icon>
<span class="text-[10px] font-bold text-[#FF6B4A]">商城</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16" href="tasks.html">
<iconify-icon class="text-[23px] text-[#B6A18E]" icon="ph:user-circle-duotone"></iconify-icon>
<span class="text-[10px] font-semibold text-[#B6A18E]">我的</span>
</a>
</div>
</nav>
<!-- 兑换确认弹层 -->
<div class="hidden absolute inset-0 z-40" id="confirmSheet">
<div class="absolute inset-0 bg-black/40" id="sheetMask"></div>
<div class="absolute left-0 right-0 bottom-0 bg-white rounded-t-[26px] p-5">
<div class="w-10 h-1.5 rounded-full bg-[#EFE2D3] mx-auto"></div>
<div class="mt-4 w-full h-[110px] rounded-2xl flex items-center justify-center text-[52px]" id="sheetPreview"></div>
<h3 class="mt-3 text-[16px] font-bold text-center" id="sheetTitle">商品名称</h3>
<p class="text-[11px] text-[#A08876] text-center mt-1" id="sheetSub">商品说明</p>
<div class="mt-4 flex items-center justify-between bg-[#FFF8EE] rounded-2xl px-4 py-3">
<span class="text-[12px] text-[#8A725F]">需要成长值</span>
<span class="text-[16px] font-bold text-[#FF6B4A]" id="sheetPrice">0</span>
</div>
<div class="mt-4 flex gap-3">
<button class="flex-1 h-12 rounded-full bg-[#F5EDE3] text-[14px] font-bold text-[#8A725F]" id="cancelBtn">再想想</button>
<button class="flex-[1.4] h-12 rounded-full bg-[#FF6B4A] text-[14px] font-bold text-white" id="confirmBtn">确认兑换</button>
</div>
<p class="text-[10px] text-[#A08876] text-center mt-2.5" id="sheetAfter"></p>
</div>
</div>
<!-- 兑换成功弹层 -->
<div class="hidden absolute inset-0 z-50 bg-black/45 items-center justify-center p-6" id="successModal">
<div class="w-full bg-white rounded-[26px] p-5 text-center">
<div class="w-16 h-16 mx-auto rounded-full bg-[#E7F8F3] flex items-center justify-center text-[32px]">🎁</div>
<h3 class="text-[18px] font-bold mt-3">兑换成功啦</h3>
<p class="text-[12px] text-[#8A725F] mt-1.5 leading-relaxed" id="successText">礼物已进入「我的兑换」，5 个工作日内发货。</p>
<div class="mt-4 bg-[#FFF8EE] rounded-2xl py-2.5">
<span class="text-[11px] text-[#A08876]">剩余成长值</span>
<span class="text-[15px] font-bold text-[#FF6B4A] ml-1.5" id="coinAfter">860</span>
</div>
<button class="mt-4 w-full h-12 rounded-full bg-[#FF6B4A] text-white text-[14px] font-bold" id="closeSuccess">好耶，收下</button>
<a class="mt-2.5 block text-[12px] font-semibold text-[#5AA9F8]" href="tasks.html">继续做任务攒成长值 →</a>
</div>
</div>
</div>
<script>
  const goods = [
    { id: 1, cat: 'card', title: '森林动物认知卡', sub: '30 张 · 会发音', price: 500, emoji: '🦊', bg: 'bg-[#FFEFE8]' },
    { id: 2, cat: 'toy', title: '小熊软胶积木', sub: '6 块 · 可咬磨牙', price: 1200, emoji: '🧸', bg: 'bg-[#FFF1D6]' },
    { id: 3, cat: 'book', title: '《晚安小熊》绘本', sub: '硬壳纸板书 1 本', price: 800, emoji: '📚', bg: 'bg-[#E9F3FF]' },
    { id: 4, cat: 'course', title: '亲子律动体验课', sub: '线上 30 分钟 1 节', price: 1500, emoji: '🎵', bg: 'bg-[#F1EBFF]' },
    { id: 5, cat: 'card', title: '水果蔬菜字词卡', sub: '50 张 · 带拼音', price: 900, emoji: '🍎', bg: 'bg-[#FFEFE8]' },
    { id: 6, cat: 'toy', title: '磁力拼图小火车', sub: '适合 3 岁以上', price: 1800, emoji: '🚂', bg: 'bg-[#E7F8F3]' },
    { id: 7, cat: 'book', title: '睡前故事音频包', sub: '20 个故事 · 永久听', price: 600, emoji: '🎧', bg: 'bg-[#E9F3FF]' },
    { id: 8, cat: 'parent', title: '育儿专家 1 对 1', sub: '30 分钟线上咨询', price: 2400, emoji: '👩‍⚕️', bg: 'bg-[#FFF1D6]' },
    { id: 9, cat: 'parent', title: '成长记录手册', sub: '打印版 · 顺丰包邮', price: 700, emoji: '📒', bg: 'bg-[#F1EBFF]' },
    { id: 10, cat: 'toy', title: '洗澡小黄鸭 3 只', sub: '防水 · 会叫', price: 480, emoji: '🦆', bg: 'bg-[#E7F8F3]' }
  ];

  let coins = 860;
  try {
    const saved = localStorage.getItem('yayaCoins');
    if (saved !== null && !isNaN(Number(saved))) coins = Number(saved);
  } catch (err) {}

  const grid = document.getElementById('goodsGrid');
  const coinTop = document.getElementById('coinTop');
  const catBtns = document.querySelectorAll('.cat-btn');
  let currentCat = 'all';
  let pendingGood = null;

  const sheet = document.getElementById('confirmSheet');
  const sheetMask = document.getElementById('sheetMask');
  const successModal = document.getElementById('successModal');

  function updateCoins() {
    coinTop.textContent = coins;
    document.getElementById('coinAfter').textContent = coins;
    try { localStorage.setItem('yayaCoins', String(coins)); } catch (err) {}
  }

  function renderGrid() {
    const list = goods.filter(function (g) { return currentCat === 'all' || g.cat === currentCat; });
    grid.innerHTML = list.map(function (g) {
      const can = coins >= g.price;
      return '<div class="bg-white rounded-[20px] overflow-hidden card-shadow">'
        + '<div class="h-[86px] ' + g.bg + ' flex items-center justify-center text-[38px] relative">' + g.emoji
        + (can
          ? '<span class="absolute top-2 right-2 text-[9px] font-bold bg-[#3FC1A0] text-white rounded-full px-1.5 py-0.5">可兑换</span>'
          : '<span class="absolute top-2 right-2 text-[9px] font-bold bg-[#E6D9CC] text-white rounded-full px-1.5 py-0.5">差 ' + (g.price - coins) + '</span>')
        + '</div>'
        + '<div class="p-2.5">'
        + '<p class="text-[12.5px] font-bold leading-tight">' + g.title + '</p>'
        + '<p class="text-[10px] text-[#A08876] mt-1">' + g.sub + '</p>'
        + '<div class="mt-2 flex items-center justify-between">'
        + '<span class="text-[13px] font-bold ' + (can ? 'text-[#FF6B4A]' : 'text-[#C0A98F]') + '">' + g.price + '<span class="text-[9px] font-semibold ml-0.5">成长值</span></span>'
        + '<button data-id="' + g.id + '" class="' + (can ? 'bg-[#FF6B4A] text-white' : 'bg-[#F5EDE3] text-[#B6A18E]') + ' h-7 px-2.5 rounded-full text-[10.5px] font-bold">兑换</button>'
        + '</div></div></div>';
    }).join('');

    grid.querySelectorAll('button[data-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const g = goods.find(function (x) { return x.id === Number(btn.dataset.id); });
        if (!g) return;
        if (coins < g.price) {
          alert('还差 ' + (g.price - coins) + ' 成长值，去做今天的任务攒一攒吧～');
          return;
        }
        openSheet(g);
      });
    });
  }

  function openSheet(g) {
    pendingGood = g;
    document.getElementById('sheetPreview').className = 'mt-4 w-full h-[110px] rounded-2xl flex items-center justify-center text-[52px] ' + g.bg;
    document.getElementById('sheetPreview').textContent = g.emoji;
    document.getElementById('sheetTitle').textContent = g.title;
    document.getElementById('sheetSub').textContent = g.sub;
    document.getElementById('sheetPrice').textContent = g.price;
    document.getElementById('sheetAfter').textContent = '兑换后剩余 ' + (coins - g.price) + ' 成长值';
    sheet.classList.remove('hidden');
  }

  function closeSheet() {
    sheet.classList.add('hidden');
    pendingGood = null;
  }

  function successClose() {
    successModal.classList.add('hidden');
    successModal.classList.remove('flex');
  }

  catBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      currentCat = b.dataset.cat;
      catBtns.forEach(function (x) { x.classList.toggle('active', x === b); });
      renderGrid();
    });
  });

  sheetMask.addEventListener('click', closeSheet);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  document.getElementById('confirmBtn').addEventListener('click', function () {
    if (!pendingGood) return;
    coins = Math.max(0, coins - pendingGood.price);
    const name = pendingGood.title;
    closeSheet();
    document.getElementById('successText').textContent = '「' + name + '」已进入「我的兑换」，5 个工作日内发出。';
    updateCoins();
    renderGrid();
    successModal.classList.remove('hidden');
    successModal.classList.add('flex');
  });
  document.getElementById('closeSuccess').addEventListener('click', successClose);

  updateCoins();
  renderGrid();
</script>
</body>
</html>
