<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>胎教音乐 · 芽芽成长</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #EDE6F7; color: #3B2B22; }
  .card-shadow { box-shadow: 0 8px 20px -8px rgba(90, 60, 140, 0.25); }
  .ring-spin { animation: spin 18s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .bar { transition: height .18s ease; }
  .song-item.active { background: #F1EBFF; }
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#FBF7FF] flex flex-col overflow-hidden relative">
<!-- 顶部 -->
<header class="shrink-0 px-5 pt-4 pb-2 flex items-center justify-between">
<a class="w-10 h-10 rounded-2xl bg-white card-shadow flex items-center justify-center" href="home.html">
<iconify-icon class="text-[18px] text-[#8B6BE0]" icon="ph:arrow-left-bold"></iconify-icon>
</a>
<div class="text-center">
<p class="text-[15px] font-bold">胎教音乐</p>
<p class="text-[10px] text-[#9A88B5]">给小宝宝听的温柔时光</p>
</div>
<div class="w-10 h-10 rounded-2xl bg-white card-shadow flex items-center justify-center">
<iconify-icon class="text-[18px] text-[#8B6BE0]" icon="ph:timer-fill"></iconify-icon>
</div>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden px-5 pb-4 [scrollbar-width:none] [&amp;::-webkit-scrollbar]:hidden">
<!-- 今日建议 -->
<div class="mt-2 flex items-center gap-2 bg-white/80 rounded-2xl px-3 py-2">
<span class="text-[16px]">🤰</span>
<p class="text-[10.5px] text-[#7A6690] leading-snug">孕 24 周建议：每天固定时间听 15 分钟，音量像平常聊天就好</p>
</div>
<!-- 播放器 -->
<section class="mt-3 rounded-[28px] relative overflow-hidden card-shadow">
<div class="absolute inset-0 bg-gradient-to-br from-[#9B7BEA] via-[#B18FF0] to-[#E27FC0]"></div>
<div class="relative px-5 pt-5 pb-5 text-white">
<div class="flex items-center justify-between text-[10px]">
<span class="bg-white/25 rounded-full px-2 py-0.5 font-semibold">胎教 · 舒缓安抚</span>
<span class="text-white/85">适合孕中期到临产</span>
</div>
<div class="mt-4 flex items-center justify-center">
<div class="w-[168px] h-[168px] rounded-full bg-white/15 flex items-center justify-center relative">
<div class="w-[132px] h-[132px] rounded-full bg-[#6C4FC0] ring-spin flex items-center justify-center relative" id="vinyl">
<div class="absolute inset-3 rounded-full border border-white/20"></div>
<div class="absolute inset-6 rounded-full border border-white/15"></div>
<div class="w-[46px] h-[46px] rounded-full bg-gradient-to-br from-[#FFB347] to-[#FF6B4A] flex items-center justify-center text-[20px]" id="discCenter">🎧</div>
</div>
</div>
</div>
<div class="mt-4 text-center">
<h2 class="text-[19px] font-bold" id="songTitle">小星星摇篮曲</h2>
<p class="text-[11px] text-white/80 mt-1" id="songArtist">钢琴版 · 3:24 · 舒缓 60 拍</p>
</div>
<!-- 进度 -->
<div class="mt-3">
<div class="h-1.5 rounded-full bg-white/25 relative" id="seekBar">
<div class="h-full rounded-full bg-white" id="seekFill" style="width:0%"></div>
<div class="absolute top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-white -ml-1.5" id="seekDot" style="left:0%"></div>
</div>
<div class="flex justify-between text-[10px] text-white/85 mt-1.5">
<span id="timeNow">00:00</span>
<span id="timeTotal">03:24</span>
</div>
</div>
<!-- 音波 -->
<div class="mt-3 flex items-end justify-center gap-1 h-8">
<span class="bar w-1.5 rounded-full bg-white/70" style="height:30%"></span>
<span class="bar w-1.5 rounded-full bg-white/70" style="height:55%"></span>
<span class="bar w-1.5 rounded-full bg-white/70" style="height:80%"></span>
<span class="bar w-1.5 rounded-full bg-white" style="height:60%"></span>
<span class="bar w-1.5 rounded-full bg-white/70" style="height:95%"></span>
<span class="bar w-1.5 rounded-full bg-white/70" style="height:45%"></span>
<span class="bar w-1.5 rounded-full bg-white/70" style="height:70%"></span>
<span class="bar w-1.5 rounded-full bg-white/70" style="height:35%"></span>
<span class="bar w-1.5 rounded-full bg-white/70" style="height:58%"></span>
<span class="bar w-1.5 rounded-full bg-white/70" style="height:25%"></span>
</div>
<!-- 控制 -->
<div class="mt-4 flex items-center justify-between px-2">
<button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center" id="loveBtn">
<iconify-icon class="text-[19px] text-white/80" icon="ph:heart-fill"></iconify-icon>
</button>
<button class="w-11 h-11 rounded-full bg-white/20 flex items-center justify-center" id="prevBtn">
<iconify-icon class="text-[22px] text-white" icon="ph:skip-back-fill"></iconify-icon>
</button>
<button class="w-[62px] h-[62px] rounded-full bg-white flex items-center justify-center shadow-lg" id="playBtn">
<iconify-icon class="text-[28px] text-[#8B6BE0]" icon="ph:play-fill" id="playIcon"></iconify-icon>
</button>
<button class="w-11 h-11 rounded-full bg-white/20 flex items-center justify-center" id="nextBtn">
<iconify-icon class="text-[22px] text-white" icon="ph:skip-forward-fill"></iconify-icon>
</button>
<button class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center" id="sleepBtn">
<iconify-icon class="text-[18px] text-white/80" icon="ph:moon-fill"></iconify-icon>
</button>
</div>
</div>
</section>
<!-- 播放列表 -->
<section class="mt-4">
<div class="flex items-center justify-between">
<h2 class="text-[15px] font-bold">今晚推荐曲单</h2>
<span class="text-[10px] text-[#9A88B5]">共 6 首 · 约 19 分钟</span>
</div>
<div class="mt-2.5 space-y-2" id="songList"></div>
</section>
<!-- 家长提示 -->
<div class="mt-4 bg-[#FFF1E8] rounded-[20px] p-3 flex items-start gap-2">
<iconify-icon class="text-[16px] text-[#FF6B4A] shrink-0 mt-0.5" icon="ph:speaker-high-fill"></iconify-icon>
<p class="text-[10.5px] leading-relaxed text-[#8A5E48]">播放时手机放在离肚子 1 米左右，不要直接贴腹部；每天听 15 分钟就够了，时间太长宝宝也会"听累"。</p>
</div>
<div class="h-1"></div>
</main>
<!-- 底部导航 -->
<nav class="shrink-0 bg-white border-t border-[#EFE6F8] px-3 pt-1.5 pb-3">
<div class="flex items-center justify-around">
<a class="flex flex-col items-center gap-0.5 w-16" href="home.html">
<iconify-icon class="text-[23px] text-[#B6A18E]" icon="ph:house-duotone"></iconify-icon>
<span class="text-[10px] font-semibold text-[#B6A18E]">首页</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16" href="tasks.html">
<iconify-icon class="text-[23px] text-[#B6A18E]" icon="ph:check-circle-duotone"></iconify-icon>
<span class="text-[10px] font-semibold text-[#B6A18E]">任务</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16" href="shop.html">
<iconify-icon class="text-[23px] text-[#B6A18E]" icon="ph:storefront-duotone"></iconify-icon>
<span class="text-[10px] font-semibold text-[#B6A18E]">商城</span>
</a>
<a class="flex flex-col items-center gap-0.5 w-16" href="home.html">
<iconify-icon class="text-[23px] text-[#8B6BE0]" icon="ph:music-notes-fill"></iconify-icon>
<span class="text-[10px] font-bold text-[#8B6BE0]">听一听</span>
</a>
</div>
</nav>
<div class="hidden absolute left-1/2 -translate-x-1/2 bottom-24 z-30 bg-[#3B2B22] text-white text-[12px] font-semibold px-4 py-2.5 rounded-full shadow-lg" id="toast"></div>
</div>
<script>
  const songs = [
    { title: '小星星摇篮曲', artist: '钢琴版 · 3:24 · 舒缓 60 拍', emoji: '⭐', sec: 204 },
    { title: '摇篮曲 · 勃拉姆斯', artist: '弦乐版 · 3:10 · 温柔入睡', emoji: '🌙', sec: 190 },
    { title: '雨滴与妈妈的呼吸', artist: '白噪音 · 4:05 · 安抚情绪', emoji: '🌧️', sec: 245 },
    { title: '森林清晨', artist: '轻音乐 · 3:32 · 放松心情', emoji: '🌿', sec: 212 },
    { title: '月亮船', artist: '童声哼唱 · 2:58 · 爸妈一起听', emoji: '🚢', sec: 178 },
    { title: '海浪轻轻摇', artist: '纯音乐 · 2:50 · 睡前固定曲', emoji: '🌊', sec: 170 }
  ];

  let index = 0;
  let playing = false;
  let elapsed = 0;
  let timer = null;
  let loved = false;

  const listEl = document.getElementById('songList');
  const playIcon = document.getElementById('playIcon');
  const seekFill = document.getElementById('seekFill');
  const seekDot = document.getElementById('seekDot');
  const timeNow = document.getElementById('timeNow');
  const timeTotal = document.getElementById('timeTotal');
  const vinyl = document.getElementById('vinyl');
  const bars = document.querySelectorAll('.bar');
  const toast = document.getElementById('toast');

  function fmt(s) {
    const m = Math.floor(s / 60);
    const r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.remove('hidden');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 1500);
  }

  function renderList() {
    listEl.innerHTML = songs.map(function (s, i) {
      return '<button data-i="' + i + '" class="song-item w-full text-left rounded-2xl p-2.5 flex items-center gap-2.5 ' + (i === index ? 'active' : 'bg-white') + ' card-shadow">'
        + '<div class="w-10 h-10 rounded-xl bg-[#F1EBFF] flex items-center justify-center text-[19px] shrink-0">' + s.emoji + '</div>'
        + '<div class="flex-1 min-w-0"><p class="text-[12.5px] font-bold truncate">' + s.title + '</p>'
        + '<p class="text-[10px] text-[#9A88B5] truncate mt-0.5">' + s.artist + '</p></div>'
        + (i === index
          ? '<iconify-icon icon="' + (playing ? 'ph:pause-circle-fill' : 'ph:play-circle-fill') + '" class="text-[22px] text-[#8B6BE0] shrink-0"></iconify-icon>'
          : '<iconify-icon icon="ph:play-circle-duotone" class="text-[22px] text-[#C3B4DC] shrink-0"></iconify-icon>')
        + '</button>';
    }).join('');

    listEl.querySelectorAll('.song-item').forEach(function (b) {
      b.addEventListener('click', function () {
        const i = Number(b.dataset.i);
        if (i === index) {
          togglePlay();
        } else {
          index = i;
          elapsed = 0;
          loadSong();
          playing = true;
          updatePlayer();
          showToast('开始播放：' + songs[index].title);
        }
        renderList();
      });
    });
  }

  function loadSong() {
    const s = songs[index];
    document.getElementById('songTitle').textContent = s.title;
    document.getElementById('songArtist').textContent = s.artist;
    document.getElementById('discCenter').textContent = s.emoji;
    timeTotal.textContent = fmt(s.sec);
    elapsed = 0;
  }

  function updatePlayer() {
    const s = songs[index];
    const pct = Math.min(100, (elapsed / s.sec) * 100);
    seekFill.style.width = pct + '%';
    seekDot.style.left = pct + '%';
    timeNow.textContent = fmt(elapsed);
    playIcon.setAttribute('icon', playing ? 'ph:pause-fill' : 'ph:play-fill');
    document.getElementById('discCenter').classList.toggle('text-[20px]', true);
    vinyl.style.animationPlayState = playing ? 'running' : 'paused';
    bars.forEach(function (b, i) {
      if (!playing) {
        b.style.height = Math.max(18, 30 + (i % 3) * 8) + '%';
      }
    });
  }

  function animateBars() {
    bars.forEach(function (b) {
      const h = 20 + Math.random() * 75;
      b.style.height = h + '%';
    });
  }

  function startTimer() {
    if (timer) clearInterval(timer);
    timer = setInterval(function () {
      if (!playing) return;
      elapsed = elapsed + 1;
      if (elapsed >= songs[index].sec) {
        index = (index + 1) % songs.length;
        loadSong();
        renderList();
        showToast('下一首：' + songs[index].title);
      }
      updatePlayer();
      animateBars();
    }, 1000);
  }

  function togglePlay() {
    playing = !playing;
    updatePlayer();
    renderList();
    showToast(playing ? '音乐响起来啦 🎵' : '已暂停，随时可以继续');
  }

  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('prevBtn').addEventListener('click', function () {
    index = (index - 1 + songs.length) % songs.length;
    loadSong(); updatePlayer(); renderList();
    showToast('上一首：' + songs[index].title);
  });
  document.getElementById('nextBtn').addEventListener('click', function () {
    index = (index + 1) % songs.length;
    loadSong(); updatePlayer(); renderList();
    showToast('下一首：' + songs[index].title);
  });
  document.getElementById('sleepBtn').addEventListener('click', function () {
    showToast('已设置 15 分钟后自动停止播放 🌙');
  });
  document.getElementById('loveBtn').addEventListener('click', function () {
    loved = !loved;
    const icon = document.querySelector('#loveBtn iconify-icon');
    icon.className = 'text-[19px] ' + (loved ? 'text-[#FF8FBF]' : 'text-white/80');
    showToast(loved ? '已收藏，下次直接找到' : '已取消收藏');
  });
  document.getElementById('seekBar').addEventListener('click', function (e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    elapsed = Math.floor(ratio * songs[index].sec);
    updatePlayer();
  });

  loadSong();
  updatePlayer();
  renderList();
  startTimer();
</script>
</body>
</html>
